name: FlightDeck
options:
  bundleIdPrefix: dev.flightdeck
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  FlightDeck:
    type: application
    platform: macOS
    # The user-facing product is "Flight Deck" (two words): the bundle on disk is
    # `Flight Deck.app` and the app menu / About & Quit items read "Flight Deck".
    # The *target* stays `FlightDeck` so the bundle id (dev.flightdeck.FlightDeck)
    # and every code identifier are unaffected — and PRODUCT_MODULE_NAME is pinned
    # below because it would otherwise follow PRODUCT_NAME and become `Flight_Deck`,
    # breaking `@testable import FlightDeck`.
    productName: Flight Deck
    sources:
      - Sources/FlightDeck
    dependencies:
      - framework: vendor/ghostty-artifacts/GhosttyKit.xcframework
        embed: false
    settings:
      base:
        # `productName:` above only renames the product *reference* (and the
        # test host path xcodegen derives from it); the build system names the
        # bundle from PRODUCT_NAME, so it has to be set here too or the two
        # disagree and the unit-test host goes missing.
        PRODUCT_NAME: Flight Deck
        PRODUCT_MODULE_NAME: FlightDeck
        CODE_SIGN_ENTITLEMENTS: Sources/FlightDeck/FlightDeck.entitlements
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: Flight Deck
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/FlightDeck/BridgingHeader.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/FlightDeck/GhosttyEmbed
        # libghostty (GhosttyKit) statically bundles C++ (glslang); link the C++
        # stdlib so its std::* symbols resolve. Matches Ghostty's own project.
        OTHER_LDFLAGS: -lstdc++
  FlightDeckTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/FlightDeckTests]
    dependencies:
      - target: FlightDeck
    settings:
      base: { GENERATE_INFOPLIST_FILE: "YES" }
  FlightDeckUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests/FlightDeckUITests]
    dependencies:
      - target: FlightDeck
    settings:
      base: { GENERATE_INFOPLIST_FILE: "YES" }
