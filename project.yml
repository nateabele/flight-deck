name: FlightDeck
options:
  bundleIdPrefix: dev.flightdeck
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  FlightDeck:
    type: application
    platform: macOS
    # The user-facing product is "Flight Deck" (two words): the bundle on disk is
    # `Flight Deck.app` and the app menu / About & Quit items read "Flight Deck".
    # The *target* stays `FlightDeck` so the bundle id (dev.flightdeck.FlightDeck)
    # and every code identifier are unaffected — and PRODUCT_MODULE_NAME is pinned
    # below because it would otherwise follow PRODUCT_NAME and become `Flight_Deck`,
    # breaking `@testable import FlightDeck`.
    productName: Flight Deck
    sources:
      - Sources/FlightDeck
    dependencies:
      - framework: vendor/ghostty-artifacts/GhosttyKit.xcframework
        embed: false
      - target: FleetKit
        embed: true
    settings:
      base:
        # `productName:` above only renames the product *reference* (and the
        # test host path xcodegen derives from it); the build system names the
        # bundle from PRODUCT_NAME, so it has to be set here too or the two
        # disagree and the unit-test host goes missing.
        PRODUCT_NAME: Flight Deck
        PRODUCT_MODULE_NAME: FlightDeck
        CODE_SIGN_ENTITLEMENTS: Sources/FlightDeck/FlightDeck.entitlements
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: Flight Deck
        # macOS 15+ gates local-network access behind a user prompt, and an app with no
        # usage description never gets to show it — the listener binds, advertises, and is
        # simply never discovered. The failure is silent, which is why this is here rather
        # than added when someone reports "my phone can't find my Mac".
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Flight Deck uses the local network to let your paired iPhone see your sessions.
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/FlightDeck/BridgingHeader.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/FlightDeck/GhosttyEmbed
        # libghostty (GhosttyKit) statically bundles C++ (glslang); link the C++
        # stdlib so its std::* symbols resolve. Matches Ghostty's own project.
        OTHER_LDFLAGS: -lstdc++
  FlightDeckTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # `Fixtures` is carved out into its own folder-reference entry below so its
      # subdirectory structure (e.g. `Fixtures/Codex/notifications.json`) survives into the
      # test bundle's Resources. Left in the plain group above, xcodegen's default "Copy
      # Bundle Resources" phase flattens every file to the Resources root, which would
      # collide fixtures from different adapters that happen to share a filename.
      - path: Tests/FlightDeckTests
        excludes:
          - "Fixtures/**"
      - path: Tests/FlightDeckTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: FlightDeck
      # Linked, not embedded: the copy inside "Flight Deck.app/Contents/Frameworks" is the
      # one that loads at runtime. See the DYLD_FRAMEWORK_PATH note in scripts/test-unit.sh.
      - target: FleetKit
        embed: false
    settings:
      base: { GENERATE_INFOPLIST_FILE: "YES" }
  FlightDeckUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests/FlightDeckUITests]
    dependencies:
      - target: FlightDeck
    settings:
      base: { GENERATE_INFOPLIST_FILE: "YES" }
  FleetKit:
    type: framework
    platform: macOS
    sources: [Sources/FleetKit]
    settings:
      base:
        # Swift 6 here, Swift 5 project-wide. The project-wide floor exists for vendored
        # Ghostty (not Swift-6 clean); FleetKit vendors nothing and carries the wire types
        # that cross a thread boundary on every frame, which is exactly the code that wants
        # `Sendable` checked rather than assumed. A Swift 6 module imports cleanly into a
        # Swift 5 target, so nothing else has to move.
        SWIFT_VERSION: "6.0"
        PRODUCT_MODULE_NAME: FleetKit
        GENERATE_INFOPLIST_FILE: "YES"

  # Same sources, iOS slice. This target ships nothing on its own — it is the enforcement
  # mechanism for "FleetKit imports Foundation and Network only". An `import AppKit` that
  # slipped into the shared sources compiles fine for macOS and fails here, which is the
  # only cheap way to catch it before the phone app exists. See scripts/build-ios.sh.
  FleetKitiOS:
    type: framework
    platform: iOS
    sources: [Sources/FleetKit]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_MODULE_NAME: FleetKit
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

# FleetKitiOS needs a persisted shared scheme, not xcodebuild's own implicit synthesis for
# a buildable target — that synthesis is unpersisted, undocumented, and exactly what
# scripts/build-ios.sh's `-scheme` (over `-target`) is meant not to depend on. See the
# comment there for why `-scheme` is required at all on this Xcode version.
schemes:
  FleetKitiOS:
    build:
      targets:
        FleetKitiOS: [run]
