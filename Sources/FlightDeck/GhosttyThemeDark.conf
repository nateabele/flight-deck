# Flight Deck's dark terminal theme — loaded by GhosttyApp as the `dark:` half of `theme`.
#
# These are libghostty's own built-in defaults (Config.zig `background`/`foreground`,
# terminal/color.zig `Name.default`, i.e. Tomorrow Night), written out so dark mode looks
# exactly as it did before the light theme existed, and so the pair can be read side by side.
background = #282c34
foreground = #ffffff

palette = 0=#1d1f21
palette = 1=#cc6666
palette = 2=#b5bd68
palette = 3=#f0c674
palette = 4=#81a2be
palette = 5=#b294bb
palette = 6=#8abeb7
palette = 7=#c5c8c6
palette = 8=#666666
palette = 9=#d54e53
palette = 10=#b9ca4a
palette = 11=#e7c547
palette = 12=#7aa6da
palette = 13=#c397d8
palette = 14=#70c0b1
palette = 15=#eaeaea
