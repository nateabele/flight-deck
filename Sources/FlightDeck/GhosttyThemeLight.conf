# Flight Deck's light terminal theme — loaded by GhosttyApp as the `light:` half of `theme`.
#
# Tomorrow, the light sibling of the Tomorrow Night palette libghostty uses by default (see
# GhosttyThemeDark.conf), so the same ANSI colour means the same hue in either appearance.
# Two departures from stock Tomorrow, both for legibility on a white background: white (7)
# and bright white (15) are light greys rather than #ffffff, which would be invisible text,
# and bright black (8) is Tomorrow's comment grey rather than black, so "dim" output still
# reads as dim.
background = #ffffff
foreground = #4d4d4c

palette = 0=#1d1f21
palette = 1=#c82829
palette = 2=#718c00
palette = 3=#eab700
palette = 4=#4271ae
palette = 5=#8959a8
palette = 6=#3e999f
palette = 7=#d6d6d6
palette = 8=#8e908c
palette = 9=#c82829
palette = 10=#718c00
palette = 11=#eab700
palette = 12=#4271ae
palette = 13=#8959a8
palette = 14=#3e999f
palette = 15=#efefef
