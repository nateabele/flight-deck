# Flight Deck's built-in libghostty defaults.
#
# Loaded by `GhosttyApp.init` BEFORE the user's own Ghostty config files, so anything here
# can still be overridden in ~/.config/ghostty/config. This file ships inside the app
# bundle and is not user-writable — it is a default, not a preference.

# Restore the em dash on US layouts.
#
# Ghostty auto-enables `macos-option-as-alt` when it detects a US standard layout
# (src/input/keyboard.zig: detectOptionAsAlt), because on that layout people want alt+b
# rather than "∫". The cost is that Option stops composing characters at all: the modifier
# is stripped before translation, so Shift+Option+- is sent as `ESC _` instead of producing
# U+2014. `ESC _` is the ANSI APC introducer, so a TUI input parser reads it as the start of
# a control string and swallows it — the keystroke appears to do nothing.
#
# Binding the chord explicitly gets the character back without turning option-as-alt off,
# so alt+b / alt+f / alt+backspace keep working as Alt everywhere else.
#
# Both spellings of the trigger are bound deliberately: it is the same physical key, and
# which one libghostty matches depends on whether the shifted or unshifted character is
# used to identify it. Binding both is harmless — the chord has exactly one meaning either
# way — and avoids depending on that detail.
#
# Option+- (en dash) is deliberately NOT bound: it currently produces a plain hyphen, which
# is the behaviour we want to keep.
keybind = alt+shift+-=text:—
keybind = alt+shift+_=text:—

# Give ⌘⇧T back to the menu, for Reopen Closed Session.
#
# Ghostty binds super+shift+t to `undo` on macOS (src/config/Config.zig, "Undo/redo"), and
# binds it `performable`. `MenuKeyEquivalents.shouldOfferToMenu` deliberately withholds
# performable bindings from the main menu — they must reach the terminal even when a menu
# item shares the chord — so as long as libghostty claims this key,
# `Ghostty.SurfaceView.performKeyEquivalent` swallows it and the File-menu item never fires
# while a terminal has focus, which is essentially always.
#
# Unbinding rather than reassigning: Ghostty's `undo` undoes *its own* tab, split and window
# closes. Flight Deck owns session lifetime itself — `SessionStore.closeSession` and
# `reopenLastClosed` — so the inherited binding has nothing meaningful to act on here.
#
# Loaded before the user's own config (see the header), so anyone who wants ⌘⇧T back on
# Ghostty's undo can rebind it in ~/.config/ghostty/config.
keybind = super+shift+t=unbind
